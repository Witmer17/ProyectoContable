services:
  db:
    image: postgres:16-alpine
    container_name: contable_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sistema_contable}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: contable_backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-sistema_contable}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-un_secreto_super_seguro_jwt_para_desarrollo_2026_sistema_contable}
      APISPERU_TOKEN: ${APISPERU_TOKEN:-eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJlbWFpbCI6ImhyZW1zMDc3QGdtYWlsLmNvbSIsImp0aSI6Ijk0OGNkYjg4YmJmMTRkNWQifQ.hr7rWG1FpFKMdItcsjR7f5iXFiojaWqs55_SlD8wAGo}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: contable_frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  pgdata:
