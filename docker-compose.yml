services:
  db:
    image: postgres:16-alpine
    container_name: contable_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sistema_contable}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: contable_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sistema_contable}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET en .env}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:?defina SEED_USER_PASSWORD en .env}
      SEED_DEMO: ${SEED_DEMO:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: contable_frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  pgdata:
